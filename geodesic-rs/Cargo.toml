[package]
name = "geodesic-rs"
version = "0.1.0"
edition = "2021"
authors = ["Geodesic Generator Contributors"]
description = "High-performance geodesic dome and polyhedra generator with unfolding support"
license = "MIT"

[dependencies]
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "geodesic-unfolder"
path = "src/bin/main.rs"
